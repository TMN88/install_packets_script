name: Validate OpenWrt toolkit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck busybox
      - name: POSIX and BusyBox ash syntax
        run: |
          sh -n openwrt-toolkit.sh
          busybox ash -n openwrt-toolkit.sh
      - name: ShellCheck
        run: shellcheck --severity=style --shell=sh openwrt-toolkit.sh
      - name: Isolated mock scenarios (dash)
        run: python3 -m unittest discover -s tests -v
      - name: Isolated mock scenarios (BusyBox ash)
        run: |
          mkdir -p /tmp/toolkit-test-bin
          printf '#!/bin/sh\nexec busybox ash "$@"\n' > /tmp/toolkit-test-bin/ash
          chmod +x /tmp/toolkit-test-bin/ash
          TEST_SH=/tmp/toolkit-test-bin/ash python3 -m unittest discover -s tests -v
      - name: Diff formatting
        run: git diff --check
