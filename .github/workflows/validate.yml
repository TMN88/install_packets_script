name: Validate OpenWrt toolkit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: POSIX shell syntax
        run: sh -n openwrt-toolkit.sh
      - name: Check supported package managers and failover repository
        run: |
          grep -Fq 'command -v apk' openwrt-toolkit.sh
          grep -Fq 'command -v opkg' openwrt-toolkit.sh
          grep -Fq 'apk info -e' openwrt-toolkit.sh
          grep -Fq 'opkg list-installed' openwrt-toolkit.sh
          grep -Fq 'TMN88/podkop-vpn-failover-owrt/main/install.sh' openwrt-toolkit.sh
          ! grep -Fq 'SVTagan/podkop-vpn-failover/main/install.sh' openwrt-toolkit.sh
      - name: Check component installer functions
        run: |
          grep -Fq 'install_podkop()' openwrt-toolkit.sh
          grep -Fq 'patch_podkop_russian_prompt()' openwrt-toolkit.sh
          grep -Fq 'Автоматически выбираем русский язык интерфейса' openwrt-toolkit.sh
          grep -Fq '2Grey/awg-openwrt/refs/heads/master/amneziawg-feed-install.sh' openwrt-toolkit.sh
          grep -Fq 'install_forkop()' openwrt-toolkit.sh
          grep -Fq 'ushan0v/forkop/main/install.sh' openwrt-toolkit.sh
          grep -Fq 'ИТОГИ УСТАНОВКИ' openwrt-toolkit.sh
          grep -Fq 'Некорректный выбор. Введите номера от 1 до 7' openwrt-toolkit.sh
          grep -Fq 'while :; do' openwrt-toolkit.sh
          grep -Fq 'Очистка временных файлов' openwrt-toolkit.sh
          grep -Fq 'Перезагрузить роутер сейчас?' openwrt-toolkit.sh
          grep -Fq 'printf' openwrt-toolkit.sh && grep -Fq 'Автоматически подтверждаем копирование файлов Zapret2' openwrt-toolkit.sh
          grep -Fq 'install_awg()' openwrt-toolkit.sh
          grep -Fq 'install_zapret_manager()' openwrt-toolkit.sh
          grep -Fq 'install_zapret2_routerich()' openwrt-toolkit.sh
          grep -Fq 'routerich_abort()' openwrt-toolkit.sh
          ! grep -Fq 'install_zapret2_classic' openwrt-toolkit.sh
          ! grep -Fq 'bol-van/zapret2' openwrt-toolkit.sh
          ! grep -Fq 'routerich_fallback_to_classic' openwrt-toolkit.sh
          grep -Fq 'классический Zapret2 автоматически не устанавливается' openwrt-toolkit.sh
          grep -Fq 'install_vpn_failover()' openwrt-toolkit.sh
          grep -Fq 'install_site_checker()' openwrt-toolkit.sh
      - name: Download and syntax-check POSIX installer scripts
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/itdoginfo/podkop/main/install.sh -o /tmp/podkop-install.sh
          sh -n /tmp/podkop-install.sh
          curl -fsSL https://raw.githubusercontent.com/2Grey/awg-openwrt/refs/heads/master/amneziawg-feed-install.sh -o /tmp/amneziawg-feed-install.sh
          sh -n /tmp/amneziawg-feed-install.sh
          curl -fsSL https://raw.githubusercontent.com/TMN88/podkop-vpn-failover-owrt/main/install.sh -o /tmp/podkop-vpn-failover-install.sh
          sh -n /tmp/podkop-vpn-failover-install.sh
      - name: Check Site Checker pinned revision
        run: |
          curl -fsSL https://api.github.com/repos/TMN88/Site_Checker/commits/a8a70be57225827740996d41b540b8a4b7ac20b0 >/dev/null
